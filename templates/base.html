<!doctype html>
<html class="content-container">

<head>
  <!--- import google font --->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <!--- import ajax --->
  <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
  <!--- import local stylesheets --->
  <link rel="stylesheet" href="{{url_for('static', filename='styles/main-pg-styles.css') }}">
  <link rel="stylesheet" href="{{url_for('static', filename='styles/base-styles.css') }}">
  <link rel="stylesheet" href="{{url_for('static', filename='styles/about-site-styles.css') }}">
  <title>{% block title %}{% endblock %}</title>
</head>

<body class="content-container main-container">
  {% block content %}
  {% endblock %}
</body>

</html>
